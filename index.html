<!doctype html><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1" name=viewport><meta content=ekunazanu name=author><meta content="A blogified version of xkcd, only worse and more personal and not really funny." name=description><meta content=Home property=og:title><meta content=website property=og:type><meta content="A blogified version of xkcd, only worse and more personal and not really funny." property=og:description><meta content=https://ekunazanu.foo/ property=og:url><meta content=https://ekunazanu.foo/thumbnails/other.ekunazanu.avif.png property=og:image><meta content="A black square box with rectangular eyes, signifying a face." property=og:image:alt><meta content=image/png property=og:image:type><meta content=1200 property=og:image:width><meta content=900 property=og:image:height><meta content=en_US property=og:locale><meta content=ekunazanu.foo property=og:site_name><title>ekunazanu.foo</title><link href=https://ekunazanu.foo/ rel=cannonical><link href=https://ekunazanu.foo/atom.xml rel=alternate type=application/atom+xml><link href=https://ekunazanu.foo/misc/main.css rel=stylesheet><link href=https://ekunazanu.foo/misc/favicon.png rel=icon><meta content=Zola name=generator><body><nav><ul><li><h1>ekunazanu.foo</h1><li><a href=https://ekunazanu.foo/log>Log</a><li><a href=https://ekunazanu.foo/lab>Lab</a></ul></nav><div class=print>https://ekunazanu.foo</div><main><p>Hello, World!<p><canvas id=canvasGOL></canvas><p>This is yet another blog on the internet. Nothing much here, just some <a href=/log>normal posts</a> and a few <a href=/lab>other things</a> I created that I [like to] think is cool.<p>That’s pretty much it, but here’s more <a href=/about>about</a> me and this site.</p><script>const WIDTH = 1280
const HEIGHT = 322;
const GRID_SQUARES_X = 127;
const GRID_SQUARES_Y = 32;
const CELL_SIZE = 10;

const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
const COLOR_FG = getComputedStyle(document.documentElement).getPropertyValue("--fg").trim();
const COLOR_GRAY = getComputedStyle(document.documentElement).getPropertyValue("--gray3").trim();
const COLOR_GRID = darkMode ? COLOR_GRAY : COLOR_FG;

const canvasGOL = document.getElementById('canvasGOL').getContext('2d');
canvasGOL.canvas.width = WIDTH;
canvasGOL.canvas.height = HEIGHT;


let GRID = [];
let GRID_NEXT = [];

function initializeGrid(grid, nextGrid) {
    for (let i = 0; i < GRID_SQUARES_Y; i++) {
        grid[i] = [];
        nextGrid[i] = [];
        for (let j = 0; j < GRID_SQUARES_X; j++) {
            grid[i][j] = Math.random() < 0.2 ? 1 : 0;
            nextGrid[i][j] = 0;
        }
    }
}

function initializeLogo(grid, xOffset = 4, yOffset = 4, scale = 2) {
    for (let i = yOffset; i < 12 * scale + yOffset; i++)
        for (let j = xOffset; j < 12 * scale + xOffset; j++)
            grid[i][j] = 1;
    for (let y = 2 * scale; y < 7 * scale; y++) {
        for (let x = 2 * scale; x < 5 * scale; x++) {
            grid[y + yOffset][x + xOffset] = 0;
            grid[y + yOffset][x + 5 * scale + xOffset] = 0;
        }
    }
    for (let y = 3 * scale; y < 6 * scale; y++) {
        for (let x = 3 * scale; x < 4 * scale; x++) {
            grid[y + yOffset][x + xOffset] = 1;
            grid[y + yOffset][x + 5 * scale + xOffset] = 1;
        }
    }
}

function drawSquares(canvas, grid) {
    canvas.fillStyle = COLOR_FG;
    for (let y = 0; y < GRID_SQUARES_Y; y++)
        for (let x = 0; x < GRID_SQUARES_X; x++)
            if (grid[y][x] === 1)
                canvas.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
}

function drawGrid(canvas, xOffset = 1, yOffset = 1) {
    canvas.strokeStyle = COLOR_GRID;
    canvas.lineWidth = 2;
    canvas.beginPath();
    for (let i = 0; i <= GRID_SQUARES_X; i++) {
        canvas.moveTo(xOffset + i * CELL_SIZE, yOffset);
        canvas.lineTo(xOffset + i * CELL_SIZE, yOffset + GRID_SQUARES_Y * CELL_SIZE);
    }
    for (let i = 0; i <= GRID_SQUARES_Y; i++) {
        canvas.moveTo(xOffset, yOffset + i * CELL_SIZE);
        canvas.lineTo(xOffset + GRID_SQUARES_X * CELL_SIZE, yOffset + i * CELL_SIZE);
    }
    canvas.stroke();
}

function countNeighbors(grid, x, y) {
    let count = 0;
    for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            if (i == 0 && j == 0) continue;
            let ni = (x + i + GRID_SQUARES_Y) % GRID_SQUARES_Y;
            let nj = (y + j + GRID_SQUARES_X) % GRID_SQUARES_X;
            count += grid[ni][nj];
        }
    }
    return count;
}

function updateGrid(grid, nextGrid) {
    for (let i = 0; i < GRID_SQUARES_Y; i++) {
        for (let j = 0; j < GRID_SQUARES_X; j++) {
            let neighbors = countNeighbors(grid, i, j);
            if (grid[i][j] == 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[i][j] = 0;
            } else if (grid[i][j] == 0 && neighbors == 3) {
                nextGrid[i][j] = 1;
            } else {
                nextGrid[i][j] = grid[i][j];
            }
        }
    }
    return [nextGrid, grid];
}

function gameLoop() {
    initializeLogo(GRID);
    canvasGOL.clearRect(0, 0, WIDTH, HEIGHT);
    drawSquares(canvasGOL, GRID);
    drawGrid(canvasGOL);
    [GRID, GRID_NEXT] = updateGrid(GRID, GRID_NEXT);
}

initializeGrid(GRID, GRID_NEXT);
setInterval(gameLoop, 500);</script></main>
